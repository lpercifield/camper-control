; Camper Control - SenseCAP Indicator D1 (ESP32-S3 side)
;
; Board: Seeed SenseCAP Indicator D1
;   ESP32-S3R8  - 8 MB flash, 8 MB octal PSRAM
;   4" 480x480 ST7701S RGB panel, FT6336 capacitive touch
;   RP2040 co-processor on Serial1 (not used yet)
;
; Arduino core 3.1.2 is what this is built and verified against - the same core
; Seeed's own Indicator tutorial uses, and the oldest one Arduino_GFX 1.5.3
; compiles on (1.5.3 needs ESP-IDF 5.x APIs that core 2.x does not have).
; PlatformIO's official espressif32 platform still ships core 2.x, so the
; platform below is the pioarduino fork, whose 53.03.12 tag is core 3.1.2.
;
; The same sources also build under tools/build.sh (arduino-cli). Keep the two
; in step - see docs/PORTING_NOTES.md.

[env:indicator_d1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.12/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode  = qio
board_build.psram_type  = opi
board_build.partitions  = default_8MB.csv
board_upload.flash_size = 8MB

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
; The D1 flashes through an onboard CH340 (1a86:7523), not the ESP32-S3's
; native USB. That bridge does not survive 921600 - esptool syncs, negotiates
; up, then dies with "Unable to verify flash chip connection". 460800 is stable.
upload_speed    = 460800

build_flags =
    -I include
    -I src
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; 0, not 1: the D1's ESP32-S3 native USB is not exposed on the internal
    ; hub (only the CH340 and the RP2040 are), so CDC_ON_BOOT=1 routes Serial
    ; to a port that never enumerates and the firmware's own logs vanish.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    ; LVGL reads include/lv_conf.h through this; see that file's header.
    -DLV_CONF_INCLUDE_SIMPLE
    ; See the lib_deps note below: WiFi's own sources include Network.h, and
    ; PlatformIO builds each library in isolation, so WiFi does not inherit the
    ; Networking include path from the project. This puts it there.
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

lib_deps =
    moononournation/GFX Library for Arduino@1.5.3
    lvgl/lvgl@9.2.2
    h2zero/NimBLE-Arduino@^2.5.1
    ; WiFi.h pulls in Network.h, but the core's WiFi/library.properties ships no
    ; depends= line, so the LDF never discovers Networking. Naming the bundled
    ; library here gets its sources compiled and linked; the matching -I above
    ; is what lets WiFi's own sources find the header. Both halves are needed.
    ; Revisit if a later core adds the depends= line.
    ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network

lib_ldf_mode = deep+

; Disables the RGB panel's bounce buffers, whose refill ISR lives in flash and
; panics the board when it races a flash read. One line, applied at build time
; rather than by vendoring 18 MB of Arduino_GFX. See docs/decisions/0004.
extra_scripts = pre:tools/patch_gfx.py
